name: Build & Release Zayaan Authenticator APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.0). Leave empty for automatic v1.0.<run_number>."
        required: false
        type: string
      skip_tests:
        description: "Skip unit/Robolectric tests for a faster APK build"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK Command-Line Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android Licenses & Install SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || echo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          # Disable pipefail while piping yes into sdkmanager to avoid SIGPIPE (141)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0"
          if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1"; then
            echo "::warning::platforms;android-36.1 install failed, installing platforms;android-36 as fallback"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36"
          fi

          # Re-accept any newly introduced licenses after package updates
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify or Prepare google-services.json
        id: gservices
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "Loaded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -s app/google-services.json ]; then
            python3 -m json.tool app/google-services.json > /dev/null
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "Verified existing app/google-services.json in repository."
          else
            echo "::warning::app/google-services.json was missing in repository; generating offline-build CI placeholder so APK compilation succeeds. Commit app/google-services.json or set GOOGLE_SERVICES_JSON_BASE64 secret for Firebase Cloud Backup."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "zayaan-authenticator-ci-placeholder",
              "storage_bucket": "zayaan-authenticator-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.zayaanapps.authenticator"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForOfflineCiBuildOnly"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare & Verify Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::warning::debug.keystore missing or invalid; generating a fresh valid debug keystore."
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Run Unit & Robolectric Tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Determine Release Tag & Build Type
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.meta.outputs.build_type == 'release'
        id: build_release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload > /dev/null 2>&1; then
            echo "::error::Release keystore validation failed. Ensure STORE_PASSWORD is correct and the keystore contains key alias 'upload'."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          export KEYSTORE_PATH="$KEYSTORE_FILE"
          gradle :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

          mkdir -p release-artifacts
          APK_NAME="Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${APK_NAME}"
          (cd release-artifacts && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Cleanup Release Keystore
        if: always()
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Build Signed Debug-Key APK (Ready to Install with Firebase Google Sign-In)
        if: steps.meta.outputs.build_type == 'debug'
        id: build_debug
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

          mkdir -p release-artifacts
          APK_NAME="Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${APK_NAME}"
          (cd release-artifacts && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature & Write Build Summary
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(ls release-artifacts/*.apk | head -n 1)"
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Expected APK file not found in release-artifacts/"
            exit 1
          fi

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_FILE"
          else
            echo "::warning::apksigner not found at $APKSIGNER; skipping signature verification step."
          fi

          APK_SIZE="$(du -h "$APK_FILE" | cut -f1)"
          APK_SHA256="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          {
            echo "## Zayaan Authenticator APK Build Summary"
            echo ""
            echo "- **Release Tag:** \`${{ steps.meta.outputs.release_tag }}\`"
            echo "- **Build Variant:** \`${{ steps.meta.outputs.build_type }}\`"
            echo "- **APK File:** \`$(basename "$APK_FILE")\` (${APK_SIZE})"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **Signature:** Verified with \`apksigner\`"
            if [ "${{ steps.gservices.outputs.fallback }}" = "true" ]; then
              echo "- **Warning:** Built with offline CI placeholder \`google-services.json\`. Commit \`app/google-services.json\` or add \`GOOGLE_SERVICES_JSON_BASE64\` secret for Firebase Cloud Backup."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "Zayaan Authenticator ${{ steps.meta.outputs.release_tag }}"
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Zayaan Authenticator (${{ steps.meta.outputs.release_tag }})

            - **Package Name:** `com.zayaanapps.authenticator`
            - **Build Variant:** `${{ steps.meta.outputs.build_type }}`
            - **Verification:** Signed APK verified with `apksigner`, plus RFC 6238 TOTP, AES-256-GCM / Argon2id cryptography, QR parsing, and Robolectric encrypted vault tests.

            Download the `.apk` file below to install on your Android device, and optionally verify integrity with the `.sha256` checksum file.
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
