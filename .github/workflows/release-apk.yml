name: Build & Release Zayaan Authenticator APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.0). Leave empty for automatic v1.0.<run_number>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Determine Release Tag & Build Type
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.meta.outputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
          gradle :app:assembleRelease --no-daemon
          mkdir -p release-artifacts
          APK_NAME="Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${APK_NAME}"
          (cd release-artifacts && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Build Signed Debug-Key APK (Ready to Install with Firebase Google Sign-In)
        if: steps.meta.outputs.build_type == 'debug'
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p release-artifacts
          APK_NAME="Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${APK_NAME}"
          (cd release-artifacts && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zayaan-Authenticator-${{ steps.meta.outputs.release_tag }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "Zayaan Authenticator ${{ steps.meta.outputs.release_tag }}"
          generate_release_notes: true
          body: |
            ## Zayaan Authenticator (${{ steps.meta.outputs.release_tag }})

            - **Package Name:** `com.zayaanapps.authenticator`
            - **Build Variant:** `${{ steps.meta.outputs.build_type }}`
            - **Verification:** All RFC 6238 TOTP, AES-256-GCM / Argon2id cryptography, QR parsing, and Robolectric encrypted vault tests passed.

            Download the `.apk` file below to install on your Android device, and optionally verify integrity with the `.sha256` checksum file.
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
